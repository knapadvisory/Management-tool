name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: teamhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Run smoke tests
        run: npm test
        working-directory: server

  # Deployment is PULL-based, not push-based. The VPS runs a systemd timer
  # (deploy/auto-pull.sh, installed via deploy/install-autodeploy.sh) that
  # checks origin/main every minute and redeploys TeamHub + HRMS when it moves.
  #
  # We deliberately do NOT SSH from GitHub into the VPS: runner IPs are a large
  # shifting range, so any inbound-SSH firewall change breaks it (the old
  # appleboy/ssh-action job failed with "dial tcp ...:22: i/o timeout"). Pulling
  # needs no inbound port and no secrets, and is safe for a public repo since
  # the box only ever fast-forwards to origin/main. So: merge to main → CI here
  # gates on tests → the VPS picks up the new commit within ~1 minute.
